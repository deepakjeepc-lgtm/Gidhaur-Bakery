<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="gbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="192" height="192" rx="42" fill="url(#gbGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.35"/>
  
  <!-- Chef Hat / Bakery Artisan Icon -->
  <g transform="translate(96, 70) scale(1.15)">
    <!-- Bakery Crown / Chef Hat -->
    <path d="M-22 6 C-28 -4, -14 -18, -4 -12 C0 -22, 16 -22, 20 -10 C30 -14, 40 0, 34 10 C36 14, 30 18, 22 18 L-14 18 C-22 18, -26 12, -22 6 Z" fill="url(#goldGrad)" transform="translate(-8, -4)"/>
    <path d="M-18 16 L22 16 L20 23 L-16 23 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- Brand Monogram "GB" -->
  <text 
    x="96" 
    y="142" 
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" 
    font-size="34" 
    font-weight="900" 
    fill="#ffffff" 
    text-anchor="middle" 
    letter-spacing="2"
  >
    GIDHAUR
  </text>
  <text 
    x="96" 
    y="162" 
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" 
    font-size="14" 
    font-weight="800" 
    fill="url(#goldGrad)" 
    text-anchor="middle" 
    letter-spacing="5"
  >
    BAKERY
  </text>
</svg>
